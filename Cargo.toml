[workspace]
resolver = "2"

members = [
    # Backend crates
    "crates/backend/foundation",
    "crates/backend/persistence",
    "crates/backend/auth",
    "crates/backend/server",

    # CLI crates
    "crates/cli/foundation",
    "crates/cli/db_migrations",

    # Apps
    "apps/cli",

    # Domain crates
    "crates/domain/logistics",

    # Shared crates
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/drone-inventory"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.15"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
async-trait = "0.1"

# Internationalization
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"

# Testing
tokio-test = "0.4"
tempfile = "3.15"

# Internal crates
foundation = { path = "crates/backend/foundation" }
persistence = { path = "crates/backend/persistence" }
auth = { path = "crates/backend/auth" }
server = { path = "crates/backend/server" }
shared = { path = "crates/shared" }
cli-foundation = { path = "crates/cli/foundation" }
cli-db-migrations = { path = "crates/cli/db_migrations" }
logistics = { path = "crates/domain/logistics" }
