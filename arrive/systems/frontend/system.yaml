system:
  id: frontend
  name: "Frontend"
  description: "Dioxus 0.7.x desktop-first UI with Tailwind, modularized into UI crates; subset targets iOS/Android where needed."
  default_branch: main
  owners:
    - team: inventory
  roots:
    - "apps/desktop/**"
    - "apps/mobile/**"
    - "crates/ui/**"
    - "assets/ui/**"

policies:
  advance_required_on_pr: true
  resident_gates:
    require_owner_approval: true
    require_invariant_impact_statement: true
    require_rollback_plan: true
    require_evidence_links: true

reviewability:
  thresholds:
    green: 30
    yellow: 60
  scoring_rules_version: 1
