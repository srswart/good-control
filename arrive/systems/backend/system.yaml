system:
  id: backend
  name: "Backend"
  description: "Rust backend built on Axum + GraphQL, with SQLx/SQLite persistence and crate-based domain modules."
  default_branch: main
  owners:
    - team: inventory
  roots:
    - "crates/backend/**"
    - "crates/domain/**"
    - "crates/integration/**"
    - "crates/shared/**"
    - "migrations/**"

policies:
  advance_required_on_pr: true
  resident_gates:
    require_owner_approval: true
    require_invariant_impact_statement: true
    require_rollback_plan: true
    require_evidence_links: true

reviewability:
  thresholds:
    green: 30
    yellow: 60
  scoring_rules_version: 1
