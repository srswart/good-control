# ARRIVE Registry - Repo-wide defaults and shared configuration
registry:
  repo_id: drone-inventory
  name: "Controlled Goods Inventory Management"
  description: "Inventory + WMS + compliance workflow system for industrial drones (EN+ZH), with optional Kingdee Cloud financial integration."

defaults:
  default_branch: main
  advance_id_format: "ADV-{COMPONENT}-{SEQ:3}"

vocabulary:
  stages:
    - incubating
    - candidate
    - resident

  component_types:
    - service
    - library
    - ui-area
    - infra
    - data-contract
    - crosscutting

  risk_flags:
    - resident_touched
    - migration
    - auth
    - concurrency
    - caching
    - public_api
    - new_dependency

  evidence_types:
    - ci:passed
    - tests:unit
    - tests:integration
    - tests:e2e
    - review:owner
    - docs:updated
    - tdd:red-green
    - tidy:preparatory
    - database:migration
    - security:scan

systems:
  - backend
  - cli
  - frontend

reviewability:
    thresholds:
      green: 30
      yellow: 60
    scoring_rules_version: 2
    review_time:
      base_minutes: 10
      minutes_per_point: 1.5
      minutes_per_file: 0.4
      minutes_per_risk_flag: 8
      resident_bonus_minutes: 15
      default_reviewer_multiplier: 1.0
      reviewer_multipliers: {}