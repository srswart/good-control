app = "good-control"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP__GRAPHQL_ENDPOINT = "https://good-control-api.fly.dev/graphql"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
